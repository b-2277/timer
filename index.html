<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- 加到主屏幕后全屏显示 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>倒计时</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC",system-ui,sans-serif}
body{
  background:#fff;
  color:#222;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* 顶部蓝色栏：平直，无圆角 */
.top-bar{
  background:#1e88e5;
  height:64px;
  display:flex;
  align-items:center;
  padding:0 20px;
}

/* 时间：直接铺在白底，去掉白色盒子 */
.time-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:44px 0 36px;
}
.time-box input{
  width:80px;
  padding:4px 0;
  font-size:56px;
  font-weight:700;
  text-align:center;
  border:none;
  outline:none;
  background:transparent;
  color:#222;
  font-variant-numeric:tabular-nums;
}
.colon{font-size:52px;font-weight:700;color:#b0bec5;line-height:1;padding-top:8px}

/* 快捷图标：只留圆图标，不要汉字标签，一行横排 */
.quick-row{
  display:flex;
  gap:26px;
  justify-content:center;
  flex-wrap:wrap;
  padding:10px 0 20px;
}
.quick-item{
  width:56px;height:56px;border-radius:50%;
  background:#e8f1fb;
  color:#1e88e5;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;
  cursor:pointer;
}
.quick-item:active{background:#d6e7f8}

/* 底部控制：两个圆钮靠右放 */
.ctrl-row{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:22px;
  padding:24px 24px 0;
}
.play-btn{
  width:64px;height:64px;border-radius:50%;
  background:#1e88e5;color:#fff;border:1px solid #e0e0e0;
  font-size:22px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 12px rgba(30,136,229,.3);
  transition:transform .12s;
}
.play-btn:active{transform:scale(.94)}
.reset-btn{
  width:50px;height:50px;border-radius:50%;
  background:#fff;color:#64748b;border:1px solid #e0e0e0;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.reset-btn:active{background:#f0f0f0}

@media (max-width:380px){
  .time-box input{width:64px;font-size:46px}
  .colon{font-size:46px}
  .quick-row{gap:18px}
}
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="time-wrap">
  <div class="time-box">
    <input id="h" value="00" type="number" min="0">
  </div>
  <span class="colon">:</span>
  <div class="time-box">
    <input id="m" value="00" type="number" min="0" max="59">
  </div>
  <span class="colon">:</span>
  <div class="time-box">
    <input id="s" value="00" type="number" min="0" max="59">
  </div>
</div>

<div class="quick-row">
  <div class="quick-item" onclick="startCount(1)">1′</div>
  <div class="quick-item" onclick="startCount(5)">5′</div>
  <div class="quick-item" onclick="startCount(10)">10′</div>
  <div class="quick-item" onclick="startCount(25)">25′</div>
  <div class="quick-item" onclick="startCount(60)">1h</div>
</div>

<div class="ctrl-row">
  <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
  <button class="reset-btn" onclick="resetAll()">↺</button>
</div>

<script>
let totalSec = 0;
let timer = null;
let isRun = false;
const hEl = document.getElementById('h');
const mEl = document.getElementById('m');
const sEl = document.getElementById('s');
const playBtn = document.getElementById('playBtn');

let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const notes = [523, 659, 784];
    notes.forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const start = t + i * 0.22;
      gain.gain.setValueAtTime(0.22, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.start(start);
      osc.stop(start + 0.35);
    })
  }catch(e){}
}

function fmt(n){
  n = Number(n) || 0;
  return String(n).padStart(2,'0');
}
function renderBySec(sec){
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600)/60);
  const s = sec % 60;
  hEl.value = fmt(h);
  mEl.value = fmt(m);
  sEl.value = fmt(s);
}

function togglePlay(){
  if(isRun){
    clearInterval(timer);
    timer = null;
    isRun = false;
    playBtn.innerText = '▶';
  }else{
    const h = Number(hEl.value)||0;
    const m = Math.min(59,Math.max(0,Number(mEl.value)||0));
    const s = Math.min(59,Math.max(0,Number(sEl.value)||0));
    const sec = h*3600 + m*60 + s;
    if(sec <= 0) return;
    totalSec = sec;
    renderBySec(totalSec);
    isRun = true;
    playBtn.innerText = '❚❚';
    timer = setInterval(tick,1000);
  }
}

function startCount(min){
  clearInterval(timer);
  totalSec = min * 60;
  isRun = true;
  playBtn.innerText = '❚❚';
  tick();
  timer = setInterval(tick,1000);
}

function tick(){
  totalSec--;
  renderBySec(totalSec);
  if(totalSec <= 0){
    clearInterval(timer);
    timer = null;
    isRun = false;
    playBtn.innerText = '▶';
    beep();
    // 已去掉“时间到！”弹窗，只响提示音
  }
}

function resetAll(){
  clearInterval(timer);
  timer = null;
  isRun = false;
  totalSec = 0;
  renderBySec(0);
  playBtn.innerText = '▶';
}
</script>
</body>
</html>
